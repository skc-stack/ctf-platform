# Apache vhost for CTF Target Portal.
#
# Place at: /etc/apache2/sites-available/ctf-portal.conf (Ubuntu 24.04)
# Enable:   sudo a2ensite ctf-portal
# Disable default site if needed: sudo a2dissite 000-default
#
# The Portal binds only to loopback — it is NEVER reachable from outside
# the Target VM. Students open http://127.0.0.1/ from the VM itself.

Listen 127.0.0.1:80

<VirtualHost 127.0.0.1:80>
    ServerName ctf-target-portal
    ServerAdmin root@localhost
    DocumentRoot /var/www/ctf-target-portal/public

    # Disable_functions — defense in depth. Even if a future code change
    # tries to call shell_exec/system/exec, the runtime will refuse.
    # The list is evaluated top-to-bottom on PHP 8.3.
    <Directory /var/www/ctf-target-portal/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # PHP overrides — tighten beyond php.ini defaults.
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
        php_admin_value disable_functions "exec,passthru,popen,proc_open,shell_exec,system"
        php_admin_flag allow_url_fopen Off
        php_admin_flag allow_url_include Off
        php_admin_value upload_max_filesize 1M
        php_admin_value post_max_size 1M
        php_admin_value memory_limit 32M
        php_admin_value open_basedir "/var/www/ctf-target-portal:/tmp"
    </FilesMatch>

    # Forward every non-file request to public/index.php
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]

    ErrorLog ${APACHE_LOG_DIR}/ctf-portal-error.log
    CustomLog ${APACHE_LOG_DIR}/ctf-portal-access.log combined
</VirtualHost>

# Belt-and-suspenders: at server scope, forbid access from anything
# other than loopback. The Portal's front controller ALSO checks this,
# but denying here means a misconfigured ProxyPass or rewrite won't
# accidentally expose it.
<Location />
    Require ip 127.0.0.0/8 ::1
</Location>
