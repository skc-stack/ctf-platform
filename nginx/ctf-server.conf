# CTF Server Nginx Configuration
# =============================================
# Install location: /etc/nginx/sites-available/ctf-server
# Domain: ctf.kghs.kh.edu.tw (with Let's Encrypt SSL)
# Web Root: /var/www/html/ctf.kghs.kh.edu.tw/public
# =============================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name ctf.kghs.kh.edu.tw;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ctf.kghs.kh.edu.tw;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/ctf.kghs.kh.edu.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctf.kghs.kh.edu.tw/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Document root
    root /var/www/html/ctf.kghs.kh.edu.tw/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/ctf-server-access.log;
    error_log  /var/log/nginx/ctf-server-error.log;

    # Client body size (for challenge ZIP uploads)
    client_max_body_size 50M;

    # Main location - front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Security: block PHP execution in upload directories
        location ~* ^/(storage|vendor)/.*\.php$ {
            deny all;
        }
    }

    # Block access to sensitive files
    location ~* /\.env {
        deny all;
        return 404;
    }

    location ~* /(\.(?!well-known).*|wp-config|wp-content|readme|license) {
        deny all;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API rate limiting zone (defined in http block)
    # limit_req zone=api burst=20 nodelay;
}
